name: Nexver Visuals v0.4.0 — Русская версия

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'
      - name: Сборка мода
        run: gradle build
      - name: Переименовать JAR
        run: |
          mkdir -p release
          cp build/libs/*.jar release/Nexver-Visuals-v0.4.0-RU-Forge-1.20.1.jar
      - name: Загрузить готовый мод
        uses: actions/upload-artifact@v4
        with:
          name: Nexver-Visuals-v0.4.0-RU-Forge-1.20.1
          path: release/*.jar
          if-no-files-found: error
